:root {

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 "Neue Montreal", -apple-system, system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }

header { position: sticky; top: 0; z-index: 10; background: rgba(247,242,234,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: calc(env(safe-area-inset-top) + 10px) 16px 0; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
.today-btn { font-size: 13px; color: var(--accent-ink); font-weight: 500; }
.stays { display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 10px; scrollbar-width: none; }
.top { align-items: center; }
.top-actions { display: flex; align-items: center; gap: 12px; }
.book-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
.book-btn[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.views[hidden] { display: none; }
.bk-group { margin-top: 18px; }
.bk-group h2 { font-size: 13px; font-weight: 500; margin: 0 0 2px; color: var(--accent-ink); letter-spacing: .02em; }
.bk-when { font-size: 12px; color: var(--faint); margin-top: 3px; }
.bk-title { font-size: 18px; font-weight: 500; margin: 16px 0 0; }
.bk-intro { padding-top: 4px !important; }
.bk-intro { font-size: 14px; color: var(--muted); padding-top: 14px; }
.stays::-webkit-scrollbar { display: none; }
.stay { flex: 0 0 auto; text-align: left; padding: 7px 12px; border: 1px solid var(--border); border-radius: 10px; background: transparent; }
.stay b { display: block; font-weight: 500; font-size: 15px; }
.stay span { display: block; font-size: 12px; color: var(--muted); }
.stay[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }

.views { display: flex; border-top: 1px solid var(--border); margin: 0 -16px; }
.view { flex: 1; padding: 11px 0; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
.view[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }

main { padding: 8px 16px 48px; max-width: 640px; margin: 0 auto; }

/* Plan view */
.day { border-bottom: 1px solid var(--border); scroll-margin-top: 150px; }
.day-head { width: 100%; display: flex; align-items: baseline; gap: 12px; padding: 16px 0 14px; text-align: left; }
.day-date { flex: 0 0 52px; font-size: 13px; color: var(--muted); line-height: 1.25; }
.day-date b { display: block; font-size: 22px; color: var(--text); font-weight: 500; letter-spacing: -0.02em; }
.day-title { flex: 1; font-size: 17px; font-weight: 500; }
.day-title small { display: block; font-size: 12px; font-weight: 400; color: var(--accent-ink); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; }
.chev { color: var(--faint); transition: transform .2s; font-size: 14px; }
.day.open .chev { transform: rotate(90deg); }
.day-body { display: none; padding: 0 0 18px 64px; }
.day.open .day-body { display: block; }
.travel { font-size: 14px; color: var(--muted); background: var(--bg-subtle); border-radius: 8px; padding: 9px 11px; margin-bottom: 14px; }
.tod { margin-top: 14px; }
.tod:first-child { margin-top: 0; }
.tod h3 { margin: 0 0 4px; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid rgba(221,213,200,.6); }
.tod h3 + .item { border-top: 0; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-weight: 500; font-size: 15px; }
.item-d { font-size: 14px; color: var(--muted); margin-top: 2px; }
.tag { display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: .03em; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; border: 1px solid currentColor; }
.tag.booked { color: var(--booked); }
.tag.reserve { color: var(--reserve); }
.tag.decide { color: var(--accent-ink); }
.tag.find { color: var(--accent-ink); border-style: dashed; }
.tag.walkin { color: #3C6E91; }
.tag.optional { color: var(--faint); }
.src { display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 1px; }
.src.sug { color: var(--accent-ink); }
.item.is-sug { box-shadow: inset 2px 0 0 var(--accent); padding-left: 10px; margin-left: -12px; }
.wx { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.wx .rain { color: #3C6E91; }
.emo { display: inline-block; width: 1.5em; margin-left: -1.5em; text-align: left; }
.day-body .item-main, .bk-group .item-main { padding-left: 1.5em; }
.item-note { font-size: 13px; color: var(--accent-ink); margin-top: 2px; }
.item-dist { font-size: 12px; color: var(--faint); margin-top: 3px; }
.go { flex: 0 0 auto; font-size: 13px; font-weight: 500; color: var(--accent-ink); text-decoration: none; padding: 4px 10px; border: 1px solid var(--border); border-radius: 99px; background: var(--card); margin-top: 1px; }
.go:active { background: var(--bg-subtle); }
.today-pill { font-size: 11px; font-weight: 500; background: var(--accent); color: #fff; border-radius: 99px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; letter-spacing: .03em; }

/* Nearby view */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; font-size: 14px; padding: 6px 13px; border-radius: 99px; border: 1px solid var(--border); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.cat { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-left: 6px; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; font-size: 15px; }
.foot { margin-top: 32px; font-size: 12px; color: var(--faint); text-align: center; }
</style>

<script>
(() => {
  const STAYS = window.STAYS, DAYS = window.DAYS, PLACES = window.PLACES;
  const CATS = [["all","All"],["eat","Eat"],["drink","Drink"],["coffee","Coffee"],["shop","Shop"],["see","See"]];
  const CAT_LABEL = Object.fromEntries(CATS);
  const TAG_LABEL = { booked: "Booked", reserve: "Book ahead", find: "Find a spot", decide: "Pick one", optional: "Optional" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const maps = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

  const todayJST = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo" }).format(new Date());
  const todayDay = DAYS.find(d => d.date === todayJST);
  const saved = JSON.parse(localStorage.getItem("japan-state") || "{}");
  const state = {
    stay: todayDay ? todayDay.stay : (saved.stay || STAYS[0].id),
    view: saved.view || "plan",
    cat: saved.cat || "all",
    open: new Set(todayDay ? [todayDay.date] : (saved.open || []))
  };
  const persist = () => localStorage.setItem("japan-state", JSON.stringify({ stay: state.stay, view: state.view, cat: state.cat, open: [...state.open] }));

  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00+09:00");
    return {
      day: d.toLocaleDateString("en-US", { day: "numeric", timeZone: "Asia/Tokyo" }),
      rest: d.toLocaleDateString("en-US", { weekday: "short", month: "short", timeZone: "Asia/Tokyo" })
    };
  }

  function itemHTML(it) {
    const tag = (it.tag ? `<span class="tag ${it.tag}">${TAG_LABEL[it.tag]}</span>` : "") + (it.walkin ? `<span class="tag walkin">Walk-in</span>` : "");
    const go = it.q ? `<a class="go" href="${maps(it.q)}" target="_blank" rel="noopener">Map</a>` : "";
    const d = it.d || it.note;
    const sug = it.s === "sug";
    const src = sug ? `<div class="src sug">Suggested</div>` : "";
    return `<div class="item${sug ? " is-sug" : ""}"><div class="item-main">${src}<div class="item-name">${it.e ? `<span class="emo" aria-hidden="true">${it.e}</span>` : ""}${esc(it.n)}${tag}</div>${d ? `<div class="item-d">${esc(d)}</div>` : ""}</div>${go}</div>`;
  }

  function distHTML(p, hotel) {
    const k = p.km && p.km[hotel];
    if (k == null) return "";
    const walk = Math.max(1, Math.round(k * 13));
    return k <= 2.5 ? `${k.toFixed(1)} km · about ${walk} min walk` : `${k.toFixed(1)} km from hotel`;
  }

  function renderStays() {
    $("#stays").innerHTML = STAYS.map(s =>
      `<button class="stay" data-stay="${s.id}" aria-pressed="${s.id === state.stay}"><b>${esc(s.label)}</b><span>${esc(s.sub)}</span></button>`).join("");
  }

  function renderPlan() {
    const days = DAYS.filter(d => d.stay === state.stay).sort((x, y) => x.date.localeCompare(y.date));
    return days.map(d => {
      const f = fmtDate(d.date);
      const isToday = d.date === todayJST;
      const open = state.open.has(d.date);
      const tods = [["Morning", d.morning], ["Afternoon", d.afternoon], ["Evening", d.evening]]
        .filter(([, items]) => items && items.length)
        .map(([label, items]) => `<section class="tod"><h3>${label}</h3>${items.map(itemHTML).join("")}</section>`).join("");
      return `<article class="day${open ? " open" : ""}" id="d-${d.date}">
        <button class="day-head" data-day="${d.date}" aria-expanded="${open}">
          <div class="day-date"><b>${f.day}</b>${f.rest}</div>
          <div class="day-title">${esc(d.title)}${isToday ? '<span class="today-pill">Today</span>' : ""}${wxHTML(d)}</div>
          <span class="chev">›</span>
        </button>
        <div class="day-body">${d.travel ? `<div class="travel">${esc(d.travel)}</div>` : ""}${tods}</div>
      </article>`;
    }).join("");
  }

  function renderNearby() {
    const stay = STAYS.find(s => s.id === state.stay);
    const chips = `<div class="chips">${CATS.map(([k, l]) => `<button class="chip" data-cat="${k}" aria-pressed="${k === state.cat}">${l}</button>`).join("")}</div>`;
    const list = PLACES.filter(p => p.city === stay.city && (state.cat === "all" || p.c === state.cat));
    if (!stay.areas.length || !list.length) {
      return chips + `<div class="empty">Nothing saved for ${esc(stay.label)}. Use the day plan.</div>`;
    }
    const order = ["eat", "drink", "coffee", "shop", "see"];
    const body = stay.areas.map(a => {
      const dk = p => (p.km && p.km[stay.hotel] != null) ? p.km[stay.hotel] : 999;
      const ps = list.filter(p => p.a === a).sort((x, y) => (order.indexOf(x.c) - order.indexOf(y.c)) || (dk(x) - dk(y)));
      if (!ps.length) return "";
      return `<section class="area"><h2>${esc(a)}</h2>${ps.map(p => {
        const cat = state.cat === "all" ? `<span class="cat">${CAT_LABEL[p.c]}</span>` : "";
        const dist = distHTML(p, stay.hotel);
        return `<div class="item"><div class="item-main"><div class="item-name">${esc(p.n)}${cat}</div>${p.d ? `<div class="item-d">${esc(p.d)}</div>` : ""}${p.note ? `<div class="item-note">${esc(p.note)}</div>` : ""}${dist ? `<div class="item-dist">${dist}</div>` : ""}</div><a class="go" href="${maps(p.q)}" target="_blank" rel="noopener">Map</a></div>`;
      }).join("")}</section>`;
    }).join("");
    return chips + body;
  }

  // Daily forecast from Open-Meteo (free, no key). Cached so it still shows offline.
  const WX_STAY = { tokyo1: [35.71, 139.78], kyoto: [35.01, 135.76], kanazawa: [36.56, 136.65], tokyo2: [35.66, 139.70] };
  const WX_DAY = { "2026-11-29": [34.68, 135.84], "2026-12-03": [34.84, 134.69], "2026-12-06": [36.25, 136.37] };
  const wxLoc = d => WX_DAY[d.date] || WX_STAY[d.stay];
  let WX = JSON.parse(localStorage.getItem("japan-wx") || "{}");
  function wxHTML(d) {
    const w = WX.days && WX.days[d.date];
    if (!w) return `<span class="wx">Forecast shows up about two weeks out</span>`;
    const rain = w.p == null ? "" : ` · <span class="rain">${w.p}% rain</span>`;
    return `<span class="wx">High ${w.hi}° · Low ${w.lo}°F${rain}</span>`;
  }
  async function loadWx() {
    if (WX.at && Date.now() - WX.at < 3 * 3600e3) return;
    const locs = [], keyOf = {};
    DAYS.forEach(d => { const k = wxLoc(d).join(","); if (!(k in keyOf)) { keyOf[k] = locs.length; locs.push(wxLoc(d)); } });
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + locs.map(l => l[0]).join(",") +
      "&longitude=" + locs.map(l => l[1]).join(",") +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&temperature_unit=fahrenheit&forecast_days=16";
    try {
      const r = await fetch(url); if (!r.ok) return;
      let j = await r.json(); if (!Array.isArray(j)) j = [j];
      const days = {};
      DAYS.forEach(d => {
        const daily = j[keyOf[wxLoc(d).join(",")]]?.daily; if (!daily) return;
        const i = daily.time.indexOf(d.date); if (i < 0) return;
        const hi = daily.temperature_2m_max[i], lo = daily.temperature_2m_min[i];
        if (hi == null || lo == null) return;
        days[d.date] = { hi: Math.round(hi), lo: Math.round(lo), p: daily.precipitation_probability_max[i] };
      });
      WX = { at: Date.now(), days: { ...(WX.days || {}), ...days } };
      localStorage.setItem("japan-wx", JSON.stringify(WX));
      render();
    } catch (e) { /* offline: keep cached forecast */ }
  }

  // Everything tagged "Book ahead", split into meals and events.
  function toBook() {
    const out = [];
    DAYS.forEach(d => [["Morning", d.morning], ["Afternoon", d.afternoon], ["Evening", d.evening]].forEach(([tod, items]) =>
      (items || []).forEach(it => { if (it.tag === "reserve" || it.tag === "find") out.push({ ...it, date: d.date, tod }); })));
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
  function renderBooking() {
    const all = toBook();
    if (!all.length) return `<div class="empty">Nothing left to book.</div>`;
    const find = all.filter(i => i.tag === "find"), booked = all.filter(i => i.tag === "reserve");
    const meals = booked.filter(i => i.e === "🍽️"), events = booked.filter(i => i.e !== "🍽️");
    const row = it => {
      const f = fmtDate(it.date);
      const sug = it.s === "sug" ? `<div class="src sug">Suggested</div>` : "";
      const go = it.q ? `<a class="go" href="${maps(it.q)}" target="_blank" rel="noopener">Map</a>` : "";
      return `<div class="item"><div class="item-main">${sug}<div class="item-name">${it.e ? `<span class="emo" aria-hidden="true">${it.e}</span>` : ""}${esc(it.n)}</div>${it.d ? `<div class="item-d">${esc(it.d)}</div>` : ""}<div class="bk-when">${new Date(it.date + "T12:00:00+09:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "Asia/Tokyo" })} · ${it.tod}</div></div>${go}</div>`;
    };
    const group = (title, list) => list.length ? `<section class="bk-group"><h2>${title} · ${list.length}</h2>${list.map(row).join("")}</section>` : "";
    return `<h2 class="bk-title">Needs booking</h2><div class="bk-intro">Everything tagged Book ahead that isn't booked yet, plus dinners still to find.</div>` + group("Events", events) + group("Meals", meals) + group("Dinners to find", find);
  }

  function render() {
    renderStays();
    const booking = state.stay === "booking";
    $("#bookTab").setAttribute("aria-pressed", booking);
    document.querySelector(".views").hidden = booking;
    document.querySelectorAll(".view").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
    $("#main").innerHTML = (booking ? renderBooking() : state.view === "plan" ? renderPlan() : renderNearby()) + `<div class="foot">Saved for offline use after first load.</div>`;
    $("#todayBtn").hidden = !todayDay || (state.stay === todayDay.stay && state.view === "plan");
    persist();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-stay],[data-view],[data-day],[data-cat],#todayBtn");
    if (!t) return;
    if (t.dataset.stay) { state.stay = t.dataset.stay; window.scrollTo(0, 0); }
    else if (t.dataset.view) { state.view = t.dataset.view; window.scrollTo(0, 0); }
    else if (t.dataset.cat) { state.cat = t.dataset.cat; }
    else if (t.dataset.day) {
      const id = t.dataset.day;
      state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    } else if (t.id === "todayBtn") {
      state.stay = todayDay.stay; state.view = "plan"; state.open.add(todayDay.date);
      render(); document.getElementById("d-" + todayDay.date)?.scrollIntoView({ block: "start" }); return;
    }
    render();
  });

  render();
  loadWx();
  if (todayDay && state.view === "plan") document.getElementById("d-" + todayDay.date)?.scrollIntoView({ block: "start" });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/japan/sw.js", { scope: "/japan/" }).catch(() => {});
})();
</script>
</body>
</html>
